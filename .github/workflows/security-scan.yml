name: Robust Security Scanning

on:
  workflow_call:
    inputs:
      lenguaje:
        description: 'Lenguaje a escanear'
        type: string
        default: 'todos'
      debug:
        description: 'Activar modo debug'
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      lenguaje:
        description: 'Selecciona el lenguaje a escanear'
        required: true
        default: 'todos'
        type: choice
        options:
          - todos
          - python
          - javascript
          - java
          - php
      debug:
        description: 'Activar modo debug'
        type: boolean
        default: false

  schedule:
    - cron: '0 14 * * *'

  push:
    branches: [main, master]

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  bandit:
    name: Bandit SAST Analysis
    if: ${{ inputs.lenguaje == 'python' || inputs.lenguaje == 'todos' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Bandit
        env:
          DEBUG_MODE: ${{ inputs.debug }}
        run: |
          pip install bandit
          if [ "$DEBUG_MODE" == "true" ]; then
            bandit -r . --exclude ./.git,./node_modules,./java,./javascript,./php --exit-zero -v
          else
            bandit -r . --exclude ./.git,./node_modules,./java,./javascript,./php --exit-zero
          fi

  semgrep:
    name: Semgrep Analysis
    if: ${{ inputs.lenguaje == 'python' || inputs.lenguaje == 'javascript' || inputs.lenguaje == 'java' || inputs.lenguaje == 'php' || inputs.lenguaje == 'todos' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/javascript --config p/java --config p/owasp-top-ten --error . || true

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          debug: ${{ inputs.debug == true }}

  # --- ADICIÓN: Auditoría de dependencias NPM (Para el Portafolio y Apps JS) ---
  npm-audit:
    name: NPM Dependency Audit
    if: ${{ inputs.lenguaje == 'javascript' || inputs.lenguaje == 'todos' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run npm audit
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high || true
          else
            echo "⚠️ No package.json found - skipping audit"
          fi

  # --- ADICIÓN: Linter de Seguridad (Valida vercel.json, locales/*.json, YAML) ---
  linter:
    name: Config & JSON Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Super-Linter
        uses: github/super-linter/slim@v5
        env:
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_JAVASCRIPT_ESLINT: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Analysis
    if: |
      github.repository_visibility == 'public' && (
        inputs.lenguaje == 'python' ||
        inputs.lenguaje == 'javascript' ||
        inputs.lenguaje == 'java' ||
        inputs.lenguaje == 'php' ||
        inputs.lenguaje == 'todos' ||
        github.event_name != 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript, java]
      fail-fast: false
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check language files exist
        id: check
        run: |
          if [ "${{ matrix.language }}" == "javascript" ]; then
            count=$(find . -name "*.js" -o -name "*.ts" | grep -v node_modules | wc -l)
          elif [ "${{ matrix.language }}" == "python" ]; then
            count=$(find . -name "*.py" | grep -v node_modules | wc -l)
          elif [ "${{ matrix.language }}" == "java" ]; then
            count=$(find . -name "*.java" | grep -v node_modules | wc -l)
          fi
          echo "count=$count" >> $GITHUB_OUTPUT
      - name: Run CodeQL init
        if: steps.check.outputs.count != '0'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          debug: ${{ inputs.debug == true }}
      - name: Run CodeQL autobuild
        if: steps.check.outputs.count != '0'
        uses: github/codeql-action/autobuild@v4
      - name: Run CodeQL analyze
        if: steps.check.outputs.count != '0'
        uses: github/codeql-action/analyze@v4

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check License
        run: |
          if [ ! -f LICENSE ]; then
            echo "⚠️ No LICENSE file found"
            exit 0
          else
            echo "✅ LICENSE file found"
            cat LICENSE | head -3
          fi

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, bandit, semgrep, trivy, license-check, npm-audit, linter]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Summary
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          BANDIT_RESULT: ${{ needs.bandit.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          NPM_RESULT: ${{ needs.npm-audit.result }}
          LINTER_RESULT: ${{ needs.linter.result }}
          LICENSE_RESULT: ${{ needs.license-check.result }}
          LENGUAJE: ${{ inputs.lenguaje || 'todos' }}
          DEBUG: ${{ inputs.debug || 'false' }}
          VISIBILIDAD: ${{ github.repository_visibility }}
          EVENTO: ${{ github.event_name }}
        run: |
          echo "## 🔒 Robust Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning (Gitleaks) | $GITLEAKS_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit SAST (Python) | $BANDIT_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep Multi-lang | $SEMGREP_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Vulnerability Scan | $TRIVY_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Dependency Audit | $NPM_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Config & JSON Linting | $LINTER_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| License Compliance | $LICENSE_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Contexto" >> $GITHUB_STEP_SUMMARY
          echo "- **Lenguaje Seleccionado:** $LENGUAJE" >> $GITHUB_STEP_SUMMARY
          echo "- **Modo Debug:** $DEBUG" >> $GITHUB_STEP_SUMMARY
          echo "- **Visibilidad Repo:** $VISIBILIDAD" >> $GITHUB_STEP_SUMMARY
          echo "- **Evento de Disparo:** $EVENTO" >> $GITHUB_STEP_SUMMARY
