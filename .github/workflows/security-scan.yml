name: Robust Security Scanning

on:
  workflow_call:
    inputs:
      lenguaje:
        description: 'Lenguaje a escanear'
        type: string
        default: 'todos'
      debug:
        description: 'Activar modo debug'
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      lenguaje:
        description: 'Selecciona el lenguaje a escanear'
        required: true
        default: 'todos'
        type: choice
        options:
          - todos
          - python
          - javascript
          - java
          - php
      debug:
        description: 'Activar modo debug'
        type: boolean
        default: false

  schedule:
    - cron: '0 14 * * *'

  push:
    branches: [main, master]

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  bandit:
    name: Bandit SAST Analysis
    if: ${{ inputs.lenguaje == 'python' || inputs.lenguaje == 'todos' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Bandit
        env:
          DEBUG_MODE: ${{ inputs.debug }}
        run: |
          pip install bandit
          if [ "$DEBUG_MODE" == "true" ]; then
            bandit -r . --exclude ./.git,./node_modules,./java,./javascript,./php --exit-zero -v
          else
            bandit -r . --exclude ./.git,./node_modules,./java,./javascript,./php --exit-zero
          fi

  semgrep:
    name: Semgrep Analysis
    if: ${{ inputs.lenguaje == 'python' || inputs.lenguaje == 'javascript' || inputs.lenguaje == 'java' || inputs.lenguaje == 'php' || inputs.lenguaje == 'todos' || github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >
            p/python
            p/javascript
            p/java
            p/php
            p/secrets
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          debug: ${{ inputs.debug == true }}

  codeql:
    name: CodeQL Analysis
    if: |
      github.repository_visibility == 'public' && (
        inputs.lenguaje == 'python' ||
        inputs.lenguaje == 'javascript' ||
        inputs.lenguaje == 'java' ||
        inputs.lenguaje == 'php' ||
        inputs.lenguaje == 'todos' ||
        github.event_name != 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript, java]
        include:
          - language: php
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          debug: ${{ inputs.debug == true }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check License
        run: |
          if [ ! -f LICENSE ]; then
            echo "⚠️ No LICENSE file found"
            exit 0
          else
            echo "✅ LICENSE file found"
            cat LICENSE | head -3
          fi

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, bandit, semgrep, trivy, license-check]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Summary
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          BANDIT_RESULT: ${{ needs.bandit.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          LICENSE_RESULT: ${{ needs.license-check.result }}
          LENGUAJE: ${{ inputs.lenguaje || 'todos' }}
          DEBUG: ${{ inputs.debug || 'false' }}
          VISIBILIDAD: ${{ github.repository_visibility }}
          EVENTO: ${{ github.event_name }}
        run: |
          echo "## 🔒 Robust Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | $GITLEAKS_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit SAST | $BANDIT_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | $SEMGREP_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy | $TRIVY_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | $LICENSE_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Lenguaje:** $LENGUAJE" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug:** $DEBUG" >> $GITHUB_STEP_SUMMARY
          echo "- **Visibilidad:** $VISIBILIDAD" >> $GITHUB_STEP_SUMMARY
          echo "- **Disparado por:** $EVENTO" >> $GITHUB_STEP_SUMMARY